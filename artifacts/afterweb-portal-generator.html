<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A strange portal generator from the forgotten edges of the internet."
    />
    <title>Afterweb Portal Generator</title>
    <style>
      :root {
        color-scheme: dark;
        --void: #030707;
        --panel: #071111;
        --cyan: #00f5ed;
        --cyan-soft: rgba(0, 245, 237, 0.62);
        --cyan-dim: rgba(0, 245, 237, 0.16);
        --magenta: #ff168d;
        --text: #c8fffb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 50% 5%, rgba(0, 70, 67, 0.19), transparent 48%),
          var(--void);
        color: var(--cyan);
        font-family: "Courier New", monospace;
      }

      button {
        font: inherit;
      }

      .scanlines,
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .scanlines {
        z-index: 10;
        opacity: 0.28;
        background:
          linear-gradient(transparent 50%, rgba(0, 0, 0, 0.42) 50%),
          linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
        background-size: 100% 4px, 7px 100%;
      }

      .vignette {
        z-index: 9;
        background: radial-gradient(ellipse, transparent 38%, rgba(0, 0, 0, 0.76) 100%);
      }

      .page {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        padding: 38px 20px 24px;
      }

      .site-header {
        width: min(100%, 900px);
        margin: 8px auto 46px;
        text-align: center;
      }

      h1 {
        margin: 0 0 14px;
        color: var(--cyan);
        font-size: clamp(2rem, 6vw, 4rem);
        letter-spacing: 0.11em;
        line-height: 1.08;
        text-shadow: 0 0 8px var(--cyan-soft), 0 0 25px rgba(0, 245, 237, 0.38);
      }

      .subtitle {
        margin: 0;
        color: var(--magenta);
        font-size: clamp(0.9rem, 2.4vw, 1.3rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-shadow: 0 0 10px rgba(255, 22, 141, 0.65);
        animation: pulse 1.8s ease-in-out infinite;
      }

      .cursor {
        display: inline-block;
        width: 0.55em;
        height: 1em;
        margin-left: 0.35em;
        vertical-align: -0.15em;
        background: currentColor;
        animation: blink 1s steps(2, start) infinite;
      }

      .generate-button {
        position: relative;
        margin: 0 0 58px;
        padding: 19px 34px;
        border: 2px solid var(--cyan);
        background: rgba(0, 245, 237, 0.035);
        color: var(--cyan);
        cursor: pointer;
        font-size: clamp(1.25rem, 4vw, 2rem);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-shadow: 0 0 8px var(--cyan-soft);
        box-shadow: inset 0 0 18px rgba(0, 245, 237, 0.06), 0 0 17px rgba(0, 245, 237, 0.12);
        transition: background 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      .generate-button:hover:not(:disabled),
      .generate-button:focus-visible {
        outline: none;
        background: rgba(0, 245, 237, 0.12);
        box-shadow: inset 0 0 20px rgba(0, 245, 237, 0.12), 0 0 25px rgba(0, 245, 237, 0.24);
        transform: translateY(-2px);
      }

      .generate-button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .portal-stage {
        display: grid;
        width: min(100%, 790px);
        min-height: 370px;
        place-items: center;
      }

      .empty-state,
      .loading-state {
        display: flex;
        width: 100%;
        min-height: 370px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
        border: 1px dashed rgba(0, 245, 237, 0.22);
        background: rgba(0, 245, 237, 0.018);
        text-align: center;
      }

      .portal-mark {
        width: 62px;
        height: 62px;
        margin-bottom: 8px;
        border: 1px solid var(--cyan-soft);
        border-radius: 50%;
        box-shadow: 0 0 18px rgba(0, 245, 237, 0.14), inset 0 0 15px rgba(0, 245, 237, 0.1);
        animation: pulse 2.5s ease-in-out infinite;
      }

      .portal-mark::after {
        display: block;
        width: 30px;
        height: 30px;
        margin: 15px;
        border: 1px solid var(--cyan-soft);
        border-radius: 50%;
        content: "";
      }

      .empty-title {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.13em;
      }

      .empty-copy {
        margin: 0;
        color: rgba(0, 245, 237, 0.46);
        font-size: 0.78rem;
        letter-spacing: 0.1em;
      }

      .loading-state {
        color: var(--cyan);
        font-size: 1.2rem;
        letter-spacing: 0.12em;
        animation: pulse 0.8s ease-in-out infinite;
      }

      .portal-card {
        position: relative;
        width: 100%;
        min-height: 350px;
        padding: 26px;
        overflow: hidden;
        border: 1px solid rgba(0, 245, 237, 0.55);
        background:
          radial-gradient(circle at 95% 0%, rgba(0, 245, 237, 0.09), transparent 28%),
          rgba(4, 15, 15, 0.92);
        box-shadow: inset 0 0 32px rgba(0, 245, 237, 0.05), 0 0 28px rgba(0, 245, 237, 0.12);
        animation: portal-reveal 550ms ease-out both;
      }

      .card-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--cyan-dim);
      }

      .status-line {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(0, 245, 237, 0.65);
        font-size: 0.78rem;
        letter-spacing: 0.1em;
      }

      .status {
        padding: 5px 8px;
        border: 1px solid currentColor;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .status-active { color: #56ff87; }
      .status-dormant { color: #96a5a5; }
      .status-unstable { color: #ffe25b; }
      .status-corrupted { color: #ff438f; }
      .status-sealed { color: #cd8aff; }

      .coordinates {
        padding: 5px 8px;
        border: 1px solid var(--cyan-dim);
        color: rgba(0, 245, 237, 0.78);
        font-size: 0.75rem;
      }

      .portal-name {
        margin: 25px 0 16px;
        color: var(--cyan);
        font-size: clamp(1.8rem, 5vw, 3rem);
        line-height: 1.1;
        text-shadow: 0 0 12px rgba(0, 245, 237, 0.3);
      }

      .portal-description {
        min-height: 76px;
        margin: 0 0 25px;
        color: var(--text);
        font-size: 1.02rem;
        line-height: 1.8;
      }

      .warning {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px;
        border-left: 4px solid var(--magenta);
        background: rgba(255, 22, 141, 0.08);
        color: var(--magenta);
        font-size: 0.9rem;
        font-weight: 700;
        line-height: 1.5;
        animation: warning-flicker 3s infinite;
      }

      .warning-symbol {
        font-size: 1.2rem;
      }

      .timestamp {
        margin: 18px 0 0;
        color: rgba(0, 245, 237, 0.37);
        font-size: 0.65rem;
        text-align: right;
      }

      .history {
        width: min(100%, 1050px);
        margin: 64px 0 52px;
      }

      .history[hidden] {
        display: none;
      }

      .history-heading {
        display: inline-block;
        margin: 0 0 20px;
        padding: 0 28px 10px 0;
        border-bottom: 1px solid var(--cyan-dim);
        font-size: 1.4rem;
        letter-spacing: 0.09em;
      }

      .history-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr));
        gap: 14px;
      }

      .history-card {
        min-height: 165px;
        padding: 15px;
        border: 1px solid rgba(0, 245, 237, 0.24);
        background: rgba(0, 245, 237, 0.025);
      }

      .history-card-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
        color: rgba(0, 245, 237, 0.58);
        font-size: 0.68rem;
      }

      .history-name {
        margin: 0 0 8px;
        font-size: 1.15rem;
      }

      .history-description {
        display: -webkit-box;
        overflow: hidden;
        margin: 0 0 10px;
        color: rgba(200, 255, 251, 0.8);
        font-size: 0.78rem;
        line-height: 1.55;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .history-warning {
        margin: 0;
        color: var(--magenta);
        font-size: 0.68rem;
        line-height: 1.45;
      }

      footer {
        width: min(100%, 1050px);
        margin-top: auto;
        padding: 22px 0 6px;
        border-top: 1px solid rgba(0, 245, 237, 0.12);
        color: rgba(0, 245, 237, 0.42);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-align: center;
      }

      footer p {
        margin: 5px 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes blink {
        to { visibility: hidden; }
      }

      @keyframes pulse {
        50% { opacity: 0.56; }
      }

      @keyframes portal-reveal {
        from { opacity: 0; filter: brightness(2.4); transform: scale(0.97) translateY(8px); }
        to { opacity: 1; filter: brightness(1); transform: scale(1) translateY(0); }
      }

      @keyframes warning-flicker {
        0%, 91%, 94%, 100% { opacity: 1; }
        92%, 93% { opacity: 0.55; }
      }

      @media (max-width: 600px) {
        .page { padding: 28px 14px 18px; }
        .site-header { margin-bottom: 35px; }
        .generate-button { margin-bottom: 38px; padding: 16px 20px; }
        .portal-card { padding: 19px; }
        .coordinates { width: 100%; }
        .portal-stage, .empty-state, .loading-state { min-height: 330px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <main class="page">
      <header class="site-header">
        <h1>AFTERWEB PORTAL GENERATOR</h1>
        <p class="subtitle">
          [//] WARNING: UNAUTHORIZED ACCESS DETECTED<span class="cursor" aria-hidden="true"></span>
        </p>
      </header>

      <button class="generate-button" id="generate-button" type="button">
        GENERATE PORTAL
      </button>

      <section class="portal-stage" id="portal-stage" aria-live="polite" aria-label="Generated portal">
        <div class="empty-state">
          <div class="portal-mark" aria-hidden="true"></div>
          <p class="empty-title">NO PORTAL ACTIVE</p>
          <p class="empty-copy">AWAITING GENERATION PROTOCOL</p>
        </div>
      </section>

      <section class="history" id="history" hidden aria-label="Recent portals">
        <h2 class="history-heading">RECENT CONNECTIONS</h2>
        <div class="history-grid" id="history-grid"></div>
      </section>

      <footer>
        <p>© 1997-???? AFTERWEB SYSTEMS. ALL RIGHTS RESERVED.</p>
        <p>DO NOT ATTEMPT TO TRACE THIS CONNECTION.</p>
      </footer>
    </main>

    <script>
      const adjectives = [
        "Vermillion", "Hollow", "Fading", "Shattered", "Astral",
        "Bleeding", "Sunken", "Whispering", "Obsidian", "Crimson",
        "Forgotten", "Nameless", "Corrupted", "Silent", "Endless",
        "Fractured", "Abyssal", "Neon", "Tessellated", "Screaming",
        "Chrome", "Synthetic", "Euclidean", "Inverted", "Rusting"
      ];

      const nouns = [
        "Underbelly", "Meridian", "Psalms", "Gate", "Labyrinth",
        "Citadel", "Nexus", "Monolith", "Spire", "Void",
        "Engine", "Sanctuary", "Ruins", "Expanse", "Chasm",
        "Terminal", "Archive", "Sector", "Cortex", "Horizon",
        "Construct", "Spillway", "Frequency", "Catacomb", "Subroutine"
      ];

      const descriptions = [
        "A sprawling metropolis made entirely of unformatted text. The sky pulses in hexadecimal.",
        "You can hear the dial-up tones echoing from the deep. The walls are lined with server racks that bleed.",
        "An infinite loop of marble corridors. Every door leads to the same empty chatroom.",
        "Gravity behaves like a poor network connection here. Objects stutter and rubberband back into place.",
        "A graveyard of forgotten avatars. They stand perfectly still, staring at a static horizon.",
        "The air tastes like ozone and copper. Whispers of deleted forum posts drift through the ash.",
        "A geometric ocean of pure data. If you stare too long into the waves, you start forgetting your own name.",
        "Monolithic glass structures reflecting a sun that never moves. The shadows point in the wrong direction.",
        "An abandoned casino where the slot machines only roll binary. The carpet pattern makes your eyes bleed.",
        "A lush forest of tangled fiber-optic cables. The fruit is glowing and tastes like static electricity.",
        "Endless aisles of blank VHS tapes. The hum of the fluorescent lights sounds exactly like human breathing.",
        "A city submerged in a neon pink grid. The architecture defies logic, folding inward endlessly.",
        "A barren desert of crushed silica. The wind carries fragments of corrupted MIDI files.",
        "A colossal clockwork machine that has rusted in place. It is counting down to a date that doesn't exist.",
        "A subterranean transit system with no stops. The train cars are filled with mannequins reading blank newspapers.",
        "A labyrinth of chain-link fences under a sky of TV snow. You keep finding your own footprints.",
        "A sterile white void. The only object is a beige desktop computer playing a screensaver of flying toasters.",
        "A gothic cathedral constructed from motherboard components. The stained glass depicts the blue screen of death.",
        "A cavernous warehouse filled with ringing rotary phones. If you answer one, you hear yourself crying.",
        "A glitching landscape that shifts between a quiet suburb and a violent wireframe grid every few seconds."
      ];

      const warnings = [
        "DO NOT ENTER BETWEEN 3AM AND 4AM.",
        "VISUAL ARTIFACTS MAY PERSIST AFTER EXIT.",
        "PORTAL MAY NOT LEAD BACK.",
        "IGNORE THE VOICES IN THE STATIC.",
        "DO NOT ATTEMPT TO COMMUNICATE WITH LOCAL ENTITIES.",
        "MEMORY CORRUPTION IMMINENT UPON PROLONGED EXPOSURE.",
        "THE GEOMETRY IS HOSTILE.",
        "OXYGEN LEVELS UNSTABLE. DATA PACKET LOSS DETECTED.",
        "DO NOT LOOK DIRECTLY AT THE SOURCE CODE.",
        "TIME DILATION ESTIMATED AT 1:400.",
        "IF THE WALLS START BREATHING, CLOSE YOUR EYES.",
        "ALL MIRRORS IN THIS SECTOR ARE TO BE AVOIDED.",
        "GRAVITY ANOMALIES MAY CAUSE SEVERE DISORIENTATION.",
        "THE WATER IS NOT WATER.",
        "DO NOT TRUST ANY MEMORIES FORMED IN THIS ZONE.",
        "YOUR REFLECTION MAY ACT INDEPENDENTLY.",
        "RADIO FREQUENCIES ARE MONITORED BY UNKNOWN ACTORS.",
        "AVOID THE SHADOWS; THEY DO NOT BELONG TO YOU.",
        "IF YOU HEAR YOUR NAME, RUN.",
        "THIS PORTAL HAS BEEN QUARANTINED SINCE 1999."
      ];

      const statuses = ["ACTIVE", "DORMANT", "UNSTABLE", "CORRUPTED", "SEALED"];
      const portalStage = document.getElementById("portal-stage");
      const historySection = document.getElementById("history");
      const historyGrid = document.getElementById("history-grid");
      const generateButton = document.getElementById("generate-button");
      let currentPortal = null;
      let portalHistory = [];

      function pickRandom(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function makeCoordinates() {
        const latitude = (Math.random() * 90).toFixed(1);
        const latitudeDirection = Math.random() > 0.5 ? "N" : "S";
        const longitude = (Math.random() * 180).toFixed(1);
        const longitudeDirection = Math.random() > 0.5 ? "E" : "W";
        const depth = Math.floor(Math.random() * 15);

        return `[${latitude}°${latitudeDirection} :: ${longitude}°${longitudeDirection} :: DEPTH: ${depth}]`;
      }

      function generatePortal() {
        return {
          name: `The ${pickRandom(adjectives)} ${pickRandom(nouns)}`,
          description: pickRandom(descriptions),
          warning: pickRandom(warnings),
          status: pickRandom(statuses),
          coordinates: makeCoordinates(),
          timestamp: new Date().toLocaleTimeString([], { hour12: false })
        };
      }

      function renderPortal(portal) {
        portalStage.innerHTML = `
          <article class="portal-card">
            <div class="card-top">
              <div class="status-line">
                <span>STATUS:</span>
                <span class="status status-${portal.status.toLowerCase()}">${portal.status}</span>
              </div>
              <div class="coordinates">${portal.coordinates}</div>
            </div>
            <h2 class="portal-name">${portal.name}</h2>
            <p class="portal-description">${portal.description}</p>
            <div class="warning">
              <span class="warning-symbol" aria-hidden="true">!</span>
              <span>${portal.warning}</span>
            </div>
            <p class="timestamp">INIT: ${portal.timestamp}</p>
          </article>
        `;
      }

      function renderHistory() {
        historySection.hidden = portalHistory.length === 0;
        historyGrid.innerHTML = portalHistory.map((portal) => `
          <article class="history-card">
            <div class="history-card-top">
              <span>STATUS: ${portal.status}</span>
              <span>${portal.coordinates}</span>
            </div>
            <h3 class="history-name">${portal.name}</h3>
            <p class="history-description">${portal.description}</p>
            <p class="history-warning">${portal.warning}</p>
          </article>
        `).join("");
      }

      generateButton.addEventListener("click", () => {
        if (currentPortal) {
          portalHistory = [currentPortal, ...portalHistory].slice(0, 5);
        }

        generateButton.disabled = true;
        generateButton.textContent = "INITIALIZING...";
        portalStage.innerHTML = '<div class="loading-state">CONNECTING TO MAINFRAME...</div>';

        window.setTimeout(() => {
          currentPortal = generatePortal();
          renderPortal(currentPortal);
          renderHistory();
          generateButton.disabled = false;
          generateButton.textContent = "GENERATE PORTAL";
        }, 500);
      });
    </script>
  </body>
</html>
